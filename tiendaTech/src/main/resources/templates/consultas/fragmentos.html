<!-- fragmento 1 para Agregar producto en ventana modal -->
<section th:fragment="tabs" class="py-3 mb-4">
    <div class="d-flex justify-content-center px-5"> 
        <ul class="nav nav-underline">
            <li class="nav-item">
                <a th:href="@{/}" 
                   th:classappend="${idCategoriaActual == null} ? 'active'"
                   class="nav-link" 
                   aria-current="page">
                    [[#{consultas.todas}]]
                </a>
            </li>
            <li th:each="c : ${categorias}" class="nav-item">
                <a th:href="@{/consultas/{id}(id=${c.idCategoria})}"
                   th:classappend="${idCategoriaActual != null and idCategoriaActual.equals(c.idCategoria)} ? 'active'"
                   class="nav-link">
                    [[${c.descripcion}]]
                </a>
            </li>
        </ul>
    </div>
</section>

<!-- fragmento 2 para el listado de productos en tarjetas -->
<section th:fragment="tarjetas(mostrarCarrito)" class="container py-4">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">
        <div th:if="${errorConsulta == null and (productos == null or productos.empty)}"
             class="text-center py-4 w-100">
            <span>[[#{lista.vacia}]]</span>
        </div>
        <div th:each="p : ${productos}" class="col">
            <div class="card h-100 shadow">
                <div class="d-flex justify-content-center align-items-center bg-light p-3"
                     style="height: 200px;">
                    <img th:src="${p.rutaImagen}" th:alt="${p.descripcion}"
                         class="img-fluid"
                         style="max-height: 100%; object-fit: contain"/>
                </div>
                <div class="card-header bg-white">
                    <h5 class="card-title text-center text-truncate mb-0">[[${p.descripcion}]]</h5>
                </div>
                <div class="card-body d-flex flex-column">
                    <p class="card-text text-muted mb-auto text-truncate">[[${p.detalle}]]</p>
                </div>
                <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                    <div class="fw-bold">
                        <span class="text-success h5">[[${#numbers.formatCurrency(p.precio)}]]</span>
                        <span th:if="${p.existencias > 0}" class="badge text-bg-success ms-2">[[${p.existencias}]] unidades</span>
                        <span th:unless="${p.existencias > 0}" class="badge text-bg-danger ms-2">Agotado</span>
                    </div>
                    <form th:if="${mostrarCarrito}" th:action="@{/carrito/agregar}" th:method="POST" class="d-inline">
                        <input type="hidden" th:value="${p.idProducto}" name="idProducto"/>
                        <button type="button" 
                                class="btn btn-sm btn-primary" 
                                th:disabled="${p.existencias == 0}"
                                onclick="addCart(this.form)">
                            <i class="fas fa-cart-plus"></i>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</section>
